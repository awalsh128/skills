name: Hello Action
description: Greets someone and records the time
inputs:
  who-to-greet:
    description: Who to greet
    required: true
  shout:
    description: Upper-case the greeting
    required: false
    default: "false"
outputs:
  time:
    description: The time we greeted you
runs:
  using: node20
  main: dist/index.js
